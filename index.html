<script>
  let ytPlayer;
  let isPlaying = false;

  function onYouTubeIframeAPIReady() {
    ytPlayer = new YT.Player('yt-player', {
      height: '1',
      width: '1',
      videoId: 'e28036ValjA',
      playerVars: {
        autoplay: 0,
        controls: 0
      }
    });
  }

  document.getElementById('music-toggle').addEventListener('click', function (e) {
    e.preventDefault();
    if (!ytPlayer || typeof ytPlayer.playVideo !== 'function') return;

    if (isPlaying) {
      ytPlayer.pauseVideo();
    } else {
      ytPlayer.playVideo();
    }
    isPlaying = !isPlaying;
  });
</script>
